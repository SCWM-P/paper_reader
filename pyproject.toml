[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reader-workspace"
version = "0.1.0"
description = "Literature reading, PDF translation and portable paper archives"
requires-python = ">=3.11,<3.13"
dependencies = ["PyYAML>=6,<7", "rich>=13,<15"]

[project.optional-dependencies]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "markdown-it-py>=3,<5"]
pdf = ["PyMuPDF==1.25.2"]
translation = [
  "pdf2zh==1.9.11",
  # PDFMathTranslate issue #1167: later Tencent SDK releases remove TextTranslate.
  "tencentcloud-sdk-python-tmt==3.1.70",
]

video = ["manim==0.21.0"]

[project.scripts]
paper = "paper_reader.scripts.cli:main"

[tool.setuptools]
packages = ["paper_reader", "paper_reader.scripts", "paper_reader_wiki"]

[tool.setuptools.package-dir]
paper_reader = ".agents/skills/zotero"
paper_reader_wiki = ".agents/skills/llm-wiki/paper_reader_wiki"

[tool.setuptools.package-data]
paper_reader_wiki = ["static/*", "static/assets/*", "static/assets/fonts/*"]
paper_reader = [
  "SKILL.md",
  "assets/templates/*",
  "assets/vendor/*/*",
  "assets/vendor/katex/contrib/*",
  "assets/vendor/katex/fonts/*",
]

[tool.paper-reader.translation]
service = "deepseek"
model = "deepseek-flash"
api-key-env = "DEEPSEEK_API_KEY"
target-language = "zh"
fallback-service = "google"

[tool.paper-reader.archive]
root = "papers"
note = "note.html"
record = "assets/reading-record.json"

[tool.paper-reader.wiki]
root = "wiki"
